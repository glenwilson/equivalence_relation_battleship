<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Equivalence Battleship</title>

  <style>
    :root {
      --navy: #102a43;
      --navy-light: #183b56;
      --blue: #247ba0;
      --blue-dark: #17627f;
      --orange: #f59e0b;
      --orange-dark: #c56f00;
      --green: #23845a;
      --red: #c83e3e;
      --paper: #f4f8fb;
      --white: #ffffff;
      --ink: #1f2933;
      --muted: #64748b;
      --border: #d7e0e8;
      --shadow: 0 14px 35px rgba(16, 42, 67, 0.12);
      --radius: 18px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family:
        Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
      background:
        radial-gradient(
          circle at top left,
          rgba(36, 123, 160, 0.14),
          transparent 32rem
        ),
        linear-gradient(
          180deg,
          #edf7fb 0%,
          var(--paper) 48%,
          #edf2f7 100%
        );
    }

    button,
    select,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    button:disabled,
    select:disabled {
      cursor: not-allowed;
      opacity: 0.5;
    }

    button:focus-visible,
    select:focus-visible,
    input:focus-visible {
      outline: 3px solid rgba(36, 123, 160, 0.28);
      outline-offset: 2px;
    }

    h1,
    h2,
    h3,
    p {
      margin-top: 0;
    }

    h1 {
      margin-bottom: 5px;
      color: var(--navy);
      font-size: clamp(1.7rem, 5vw, 2.6rem);
      line-height: 1.05;
    }

    h2 {
      color: var(--navy);
    }

    h3 {
      color: var(--navy);
    }

    .app-shell {
      width: min(1180px, calc(100% - 26px));
      margin: 0 auto;
      padding: 26px 0 50px;
    }

    .hero {
      display: flex;
      align-items: center;
      gap: 15px;
      margin-bottom: 24px;
    }

    .logo {
      display: grid;
      flex: 0 0 auto;
      place-items: center;
      width: 60px;
      height: 60px;
      border-radius: 18px;
      color: white;
      font-size: 30px;
      font-weight: 900;
      background: linear-gradient(145deg, var(--navy), var(--blue));
      box-shadow: var(--shadow);
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
    }

    .card {
      padding: 22px;
      border: 1px solid rgba(215, 224, 232, 0.94);
      border-radius: var(--radius);
      background: rgba(255, 255, 255, 0.95);
      box-shadow: var(--shadow);
    }

    .setup-grid,
    .game-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.3fr) minmax(290px, 0.7fr);
      gap: 20px;
    }

    .field-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 15px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    label,
    .label {
      color: var(--navy);
      font-size: 0.88rem;
      font-weight: 780;
    }

    select,
    input[type="text"] {
      width: 100%;
      min-height: 46px;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 11px;
      color: var(--ink);
      background: white;
    }

    .small-note {
      color: var(--muted);
      font-size: 0.88rem;
      line-height: 1.5;
    }

    .info-box {
      margin-top: 16px;
      padding: 14px;
      border: 1px solid #c8e2ed;
      border-radius: 12px;
      color: #174f68;
      background: #f1faff;
      line-height: 1.5;
    }

    .rule-card {
      margin-top: 18px;
      padding: 18px;
      border: 1px solid #c8e2ed;
      border-left: 6px solid var(--blue);
      border-radius: 14px;
      background: #f2fbff;
    }

    .rule-card h3 {
      margin-bottom: 7px;
    }

    .rule-card p {
      margin-bottom: 8px;
      line-height: 1.55;
    }

    .stars {
      color: var(--orange-dark);
      letter-spacing: 2px;
    }

    .button-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      margin-top: 18px;
    }

    .btn {
      min-height: 43px;
      padding: 10px 16px;
      border: 0;
      border-radius: 11px;
      font-weight: 780;
      transition:
        transform 120ms ease,
        box-shadow 120ms ease;
    }

    .btn:hover:not(:disabled) {
      transform: translateY(-1px);
    }

    .btn-primary {
      color: white;
      background: linear-gradient(135deg, var(--blue), var(--blue-dark));
      box-shadow: 0 8px 18px rgba(36, 123, 160, 0.22);
    }

    .btn-secondary {
      color: var(--navy);
      border: 1px solid var(--border);
      background: white;
    }

    .btn-warning {
      color: white;
      background: linear-gradient(135deg, var(--orange), var(--orange-dark));
    }

    .btn-danger {
      color: white;
      background: var(--red);
    }

    .rules-list {
      display: grid;
      gap: 10px;
    }

    .mini-rule {
      padding: 13px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: white;
    }

    .mini-rule strong {
      color: var(--navy);
    }

    .mini-rule p {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 0.9rem;
      line-height: 1.45;
    }

    .status-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 20px;
      padding: 15px 18px;
      border-radius: 15px;
      color: white;
      background: linear-gradient(135deg, var(--navy), var(--navy-light));
      box-shadow: var(--shadow);
    }

    .status-bar strong {
      color: #ffd27a;
    }

    .action-box {
      margin-bottom: 18px;
      padding: 18px;
      border: 1px solid var(--border);
      border-radius: 15px;
      background: #fbfdff;
    }

    .point-picker {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 14px 0;
    }

    .pick-point {
      display: grid;
      place-items: center;
      width: 46px;
      height: 46px;
      padding: 0;
      border: 3px solid white;
      border-radius: 50%;
      color: white;
      font-weight: 850;
      background: var(--navy);
      box-shadow:
        0 0 0 2px var(--navy),
        0 5px 12px rgba(16, 42, 67, 0.2);
    }

    .pick-point.selected {
      color: var(--navy);
      background: var(--orange);
      box-shadow:
        0 0 0 3px #ffd991,
        0 6px 15px rgba(245, 158, 11, 0.3);
    }

    .question-preview {
      min-height: 34px;
      color: var(--navy);
      font-size: 1.15rem;
      font-weight: 800;
    }

    .dot-line {
      position: relative;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 5px;
      margin: 28px 0 24px;
      padding: 0 8px;
      overflow-x: auto;
    }

    .dot-line::before {
      position: absolute;
      z-index: 0;
      top: 20px;
      right: 28px;
      left: 28px;
      height: 4px;
      border-radius: 3px;
      background: #d7e0e8;
      content: "";
    }

    .dot-wrap {
      position: relative;
      z-index: 1;
      display: flex;
      flex: 1 0 43px;
      flex-direction: column;
      align-items: center;
      gap: 7px;
    }

    .dot {
      display: grid;
      place-items: center;
      width: 42px;
      height: 42px;
      padding: 0;
      border: 4px solid white;
      border-radius: 50%;
      color: white;
      font-weight: 850;
      background: var(--navy);
      box-shadow:
        0 0 0 2px var(--navy),
        0 5px 12px rgba(16, 42, 67, 0.2);
    }

    .dot.selected {
      color: var(--navy);
      background: var(--orange);
      box-shadow:
        0 0 0 3px #ffd991,
        0 6px 15px rgba(245, 158, 11, 0.28);
    }

    .dot-number {
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 700;
      white-space: nowrap;
    }

    .partition-preview {
      min-height: 80px;
      margin-top: 14px;
      padding: 14px;
      border: 1px dashed #b8c8d5;
      border-radius: 13px;
      background: #f8fafc;
    }

    .class-list {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      margin-top: 9px;
    }

    .class-pill {
      padding: 9px 12px;
      border: 0;
      border-radius: 999px;
      color: white;
      font-weight: 780;
      box-shadow: 0 5px 11px rgba(31, 41, 51, 0.12);
    }

    .empty-message {
      color: var(--muted);
      font-style: italic;
    }

    .validation {
      min-height: 24px;
      margin-top: 11px;
      font-size: 0.9rem;
      font-weight: 750;
    }

    .validation.good {
      color: var(--green);
    }

    .validation.bad {
      color: var(--red);
    }

    .knowledge-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(92px, 1fr));
      gap: 7px;
      margin-top: 14px;
    }

    .knowledge-cell {
      min-height: 42px;
      padding: 8px 6px;
      border: 1px solid var(--border);
      border-radius: 9px;
      text-align: center;
      color: var(--muted);
      font-size: 0.81rem;
      font-weight: 750;
      background: white;
    }

    button.knowledge-cell {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      transition:
        transform 100ms ease,
        border-color 100ms ease;
    }

    button.knowledge-cell:hover {
      transform: translateY(-1px);
      border-color: var(--blue);
    }

    .knowledge-cell.yes {
      color: #176b46;
      border-color: #9bd8bd;
      background: #e8f8f0;
    }

    .knowledge-cell.no {
      color: #9e2d2d;
      border-color: #f0b4b4;
      background: #fff0f0;
    }

    .knowledge-cell.unknown {
      color: var(--muted);
      background: white;
    }

    .knowledge-cell strong {
      font-size: 1rem;
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 10px;
      color: var(--muted);
      font-size: 0.82rem;
    }

    .legend span {
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .legend-mark {
      width: 12px;
      height: 12px;
      border-radius: 3px;
    }

    .score-row {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-top: 15px;
    }

    .score-box {
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 12px;
      text-align: center;
      background: white;
    }

    .score-box strong {
      display: block;
      margin-top: 3px;
      color: var(--navy);
      font-size: 1.4rem;
    }

    .log {
      display: grid;
      gap: 9px;
      max-height: 540px;
      overflow: auto;
      padding-right: 5px;
    }

    .log-entry {
      padding: 12px;
      border-left: 4px solid var(--blue);
      border-radius: 10px;
      background: #f5f9fc;
      line-height: 1.45;
    }

    .log-entry.declare {
      border-left-color: var(--orange);
      background: #fff8e8;
    }

    .log-entry small {
      display: block;
      margin-top: 4px;
      color: var(--muted);
    }

    .overlay,
    .modal {
      position: fixed;
      z-index: 100;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 18px;
      background: rgba(5, 20, 33, 0.76);
      backdrop-filter: blur(7px);
    }

    .hidden {
      display: none !important;
    }

    .overlay-card,
    .modal-card {
      width: min(720px, 100%);
      max-height: calc(100vh - 36px);
      overflow: auto;
      padding: 26px;
      border-radius: 20px;
      background: white;
      box-shadow: 0 26px 70px rgba(0, 0, 0, 0.3);
    }

    .overlay-card {
      width: min(520px, 100%);
      text-align: center;
    }

    .overlay-card .logo {
      margin: 0 auto 16px;
    }

    .result-partitions {
      display: grid;
      gap: 12px;
      margin: 18px 0;
      text-align: left;
    }

    .result-partition {
      padding: 13px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #f8fafc;
    }

    @media (max-width: 820px) {
      .setup-grid,
      .game-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 590px) {
      .field-grid {
        grid-template-columns: 1fr;
      }

      .card {
        padding: 17px;
      }

      .hero {
        align-items: flex-start;
      }

      .logo {
        width: 52px;
        height: 52px;
      }

      .pick-point {
        width: 42px;
        height: 42px;
      }

      .dot {
        width: 36px;
        height: 36px;
        border-width: 3px;
        font-size: 0.8rem;
      }

      .dot-line::before {
        top: 17px;
      }
    }
  </style>
</head>

<body>
  <main class="app-shell">
    <header class="hero">
      <div class="logo" aria-hidden="true">≈</div>

      <div>
        <h1>Equivalence Battleship</h1>
        <p class="subtitle">
          Discover the opponent’s hidden partition using equivalence questions.
        </p>
      </div>
    </header>

    <div id="app"></div>
  </main>

  <div id="privacyOverlay" class="overlay hidden"></div>
  <div id="modal" class="modal hidden"></div>

  <script>
    "use strict";

    const CLASS_COLORS = [
      "#247ba0",
      "#d97706",
      "#2e9d68",
      "#8b5cf6",
      "#d64545",
      "#0f766e",
      "#be185d",
      "#4f46e5",
      "#64748b",
      "#92400e",
      "#0369a1",
      "#7c3aed"
    ];

    const RULES = [
      {
        id: 1,
        stars: 1,
        name: "Two equal-sized classes",
        description:
          "There are exactly two equivalence classes, and they contain the same number of points."
      },
      {
        id: 2,
        stars: 2,
        name: "Pairs",
        description:
          "Every equivalence class contains exactly two points."
      },
      {
        id: 3,
        stars: 2,
        name: "Exactly two classes",
        description:
          "There are exactly two equivalence classes. Their sizes may be different."
      },
      {
        id: 4,
        stars: 1,
        name: "One class of three",
        description:
          "One class contains exactly three points. Every other point is a singleton."
      },
      {
        id: 5,
        stars: 2,
        name: "One non-singleton class",
        description:
          "Exactly one class contains at least two points. Every other point is a singleton."
      },
      {
        id: 6,
        stars: 3,
        name: "Two non-singleton classes",
        description:
          "Exactly two classes contain at least two points. Every other point is a singleton."
      },
      {
        id: 7,
        stars: 2,
        name: "Consecutive classes",
        description:
          "Every class consists of consecutive points on the number line."
      },
      {
        id: 8,
        stars: 1,
        name: "Equal consecutive classes",
        description:
          "Every class consists of consecutive points, and all classes have equal size."
      },
      {
        id: 9,
        stars: 3,
        name: "Exactly three classes",
        description:
          "The partition has exactly three equivalence classes."
      },
      {
        id: 10,
        stars: 2,
        name: "Equal-sized classes",
        description:
          "All equivalence classes have the same number of points."
      },
      {
        id: 11,
        stars: 3,
        name: "No singleton classes",
        description:
          "Every equivalence class contains at least two points."
      },
      {
        id: 12,
        stars: 1,
        name: "Remainders modulo n",
        description:
          "Two points are equivalent exactly when they have the same remainder after division by a hidden n."
      }
    ];

    let state = {
      screen: "setup",
      mode: "ai",
      size: 9,
      ruleId: 3,
      difficulty: "medium",
      deductionMode: "manual",

      players: [],
      setupPlayer: 0,
      current: 0,

      candidates: [[], []],
      manualMarks: [{}, {}],

      questionSelection: [],
      questionCounts: [0, 0],
      log: [],
      winner: null
    };

    let builder = null;

    /*
      Candidate partitions are stored as compact numbers.

      Each point uses four bits. The value in those bits identifies the
      point's class. This is exact for boards up to 12 points and uses much
      less memory than storing hundreds of thousands of nested arrays.
    */
    const candidateCache = new Map();
    const POW16 = Array.from({ length: 13 }, (_, index) => 16 ** index);

    function ruleById(id) {
      return RULES.find(rule => rule.id === Number(id));
    }

    function stars(count) {
      return "★".repeat(count);
    }

    function labelAt(code, point) {
      return Math.floor(code / POW16[point]) % 16;
    }

    function labelsToCode(labels) {
      let code = 0;

      for (let point = 0; point < labels.length; point++) {
        code += labels[point] * POW16[point];
      }

      return code;
    }

    function partitionToCode(partition, size = state.size) {
      const labels = new Array(size).fill(0);

      partition.forEach((group, classIndex) => {
        group.forEach(point => {
          labels[point] = classIndex;
        });
      });

      return labelsToCode(labels);
    }

    function codeToPartition(code, size = state.size) {
      const groups = [];

      for (let point = 0; point < size; point++) {
        const label = labelAt(code, point);

        if (!groups[label]) {
          groups[label] = [];
        }

        groups[label].push(point);
      }

      return groups.filter(Boolean);
    }

    function normalizePartition(partition) {
      return partition
        .map(group => [...group].sort((a, b) => a - b))
        .sort((a, b) => a[0] - b[0]);
    }

    function partitionKey(partition) {
      return JSON.stringify(normalizePartition(partition));
    }

    function formatPartition(partition) {
      return normalizePartition(partition)
        .map(group => `{${group.join(", ")}}`)
        .join("  ");
    }

    function sameClassCode(code, a, b) {
      return labelAt(code, a) === labelAt(code, b);
    }

    function sameClassPartition(partition, a, b) {
      return partition.some(
        group => group.includes(a) && group.includes(b)
      );
    }

    function isConsecutive(group) {
      const sorted = [...group].sort((a, b) => a - b);

      for (let index = 1; index < sorted.length; index++) {
        if (sorted[index] !== sorted[index - 1] + 1) {
          return false;
        }
      }

      return true;
    }

    function moduloPartition(size, modulus) {
      const groups = Array.from(
        { length: modulus },
        () => []
      );

      for (let point = 0; point < size; point++) {
        groups[point % modulus].push(point);
      }

      return groups.filter(group => group.length > 0);
    }

    function matchesRule(partition, ruleId, size) {
      const groups = normalizePartition(partition);
      const sizes = groups.map(group => group.length);
      const nonSingletons = groups.filter(group => group.length >= 2);
      const allConsecutive = groups.every(isConsecutive);
      const allEqual = sizes.every(sizeValue => sizeValue === sizes[0]);

      switch (Number(ruleId)) {
        case 1:
          return (
            groups.length === 2 &&
            sizes[0] === sizes[1]
          );

        case 2:
          return (
            groups.length > 0 &&
            sizes.every(sizeValue => sizeValue === 2)
          );

        case 3:
          return groups.length === 2;

        case 4:
          return (
            sizes.filter(sizeValue => sizeValue === 3).length === 1 &&
            sizes.every(sizeValue => sizeValue === 1 || sizeValue === 3)
          );

        case 5:
          return nonSingletons.length === 1;

        case 6:
          return nonSingletons.length === 2;

        case 7:
          return allConsecutive;

        case 8:
          return allConsecutive && allEqual;

        case 9:
          return groups.length === 3;

        case 10:
          return allEqual;

        case 11:
          return sizes.every(sizeValue => sizeValue >= 2);

        case 12: {
          const key = partitionKey(groups);

          for (let modulus = 1; modulus <= size; modulus++) {
            if (
              partitionKey(moduloPartition(size, modulus)) === key
            ) {
              return true;
            }
          }

          return false;
        }

        default:
          return false;
      }
    }

    function rulePossible(size, ruleId) {
      if (ruleId === 1 || ruleId === 2) {
        return size % 2 === 0;
      }

      return true;
    }

    function getCandidates(size, ruleId) {
      const cacheKey = `${size}-${ruleId}`;

      if (candidateCache.has(cacheKey)) {
        return candidateCache.get(cacheKey);
      }

      if (!rulePossible(size, ruleId)) {
        candidateCache.set(cacheKey, []);
        return [];
      }

      /*
        Cards 7, 8 and 12 have especially simple structures, so they are
        generated directly.
      */
      if (ruleId === 7) {
        const output = [];
        const numberOfBoundaries = size - 1;

        for (
          let mask = 0;
          mask < 2 ** numberOfBoundaries;
          mask++
        ) {
          const labels = new Array(size).fill(0);
          let classIndex = 0;

          for (let point = 1; point < size; point++) {
            if (mask & (1 << (point - 1))) {
              classIndex++;
            }

            labels[point] = classIndex;
          }

          output.push(labelsToCode(labels));
        }

        candidateCache.set(cacheKey, output);
        return output;
      }

      if (ruleId === 8) {
        const output = [];

        for (let classSize = 1; classSize <= size; classSize++) {
          if (size % classSize !== 0) continue;

          const labels = new Array(size);

          for (let point = 0; point < size; point++) {
            labels[point] = Math.floor(point / classSize);
          }

          output.push(labelsToCode(labels));
        }

        candidateCache.set(cacheKey, output);
        return output;
      }

      if (ruleId === 12) {
        const output = [];

        for (let modulus = 1; modulus <= size; modulus++) {
          output.push(
            partitionToCode(moduloPartition(size, modulus), size)
          );
        }

        candidateCache.set(cacheKey, [...new Set(output)]);
        return candidateCache.get(cacheKey);
      }

      const output = [];
      const labels = new Uint8Array(size);
      const counts = new Uint8Array(size);

      labels[0] = 0;
      counts[0] = 1;

      function recurse(point, maxLabel, code) {
        if (point === size) {
          const partition = codeToPartition(code, size);

          if (matchesRule(partition, ruleId, size)) {
            output.push(code);
          }

          return;
        }

        let highestAllowed = maxLabel + 1;

        if (ruleId === 1 || ruleId === 3) {
          highestAllowed = Math.min(highestAllowed, 1);
        }

        if (ruleId === 9) {
          highestAllowed = Math.min(highestAllowed, 2);
        }

        for (
          let classIndex = 0;
          classIndex <= highestAllowed;
          classIndex++
        ) {
          const newCount = counts[classIndex] + 1;

          if (ruleId === 1 && newCount > size / 2) {
            continue;
          }

          if (ruleId === 2 && newCount > 2) {
            continue;
          }

          if (ruleId === 4 && newCount > 3) {
            continue;
          }

          labels[point] = classIndex;
          counts[classIndex]++;

          let nonSingletonCount = 0;

          if (ruleId === 5 || ruleId === 6) {
            for (
              let index = 0;
              index <= Math.max(maxLabel, classIndex);
              index++
            ) {
              if (counts[index] >= 2) {
                nonSingletonCount++;
              }
            }
          }

          const invalidCard5 =
            ruleId === 5 && nonSingletonCount > 1;

          const invalidCard6 =
            ruleId === 6 && nonSingletonCount > 2;

          if (!invalidCard5 && !invalidCard6) {
            recurse(
              point + 1,
              Math.max(maxLabel, classIndex),
              code + classIndex * POW16[point]
            );
          }

          counts[classIndex]--;
        }
      }

      recurse(1, 0, 0);

      candidateCache.set(cacheKey, output);
      return output;
    }

    function randomChoice(items) {
      return items[Math.floor(Math.random() * items.length)];
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

          rule => rulePossible(state.size, rule.id)
        );

        state.ruleId = availableRule.id;
      }

      render();
    }

    function changeRule(value) {
      state.ruleId = Number(value);
      render();
    }

      state.players = [

          name: "Player 1",

          secret: null

      state.setupPlayer = 0;
      state.screen = "secret";

      initializeBuilder("setup");
      render();
    }

    function initializeBuilder(context) {
      builder = {
        context,
        classes: [],

    }

    function assignedPoints() {
      return new Set(builder.classes.flat());
    }

    function builderMarkup() {
      return `

    function renderSecretSetup() {
      const player = state.players[state.setupPlayer];
      const rule = ruleById(state.ruleId);

      document.getElementById("app").innerHTML = `
        <section class="card">
          <h2>${escapeHtml(player.name)}: create your secret</h2>

          <p class="small-note">

            </button>

    function updateBuilderView() {
      if (!builder) return;

      const assigned = assignedPoints();
      const dotLine = document.getElementById("dotLine");
      const classList = document.getElementById("classList");
      const validation = document.getElementById("builderValidation");

      if (!dotLine || !classList || !validation) return;

      dotLine.innerHTML = Array
        .from({ length: state.size }, (_, point) => {
          const classIndex = builder.classes.findIndex(
            group => group.includes(point)
          );

          const isAssigned = assigned.has(point);
          const isSelected = builder.selected.has(point);

          const color =
            classIndex >= 0
              ? CLASS_COLORS[classIndex % CLASS_COLORS.length]
              : "#102a43";

          return `
            <div class="dot-wrap">
              <button
                class="dot ${isSelected ? "selected" : ""}"
                style="${
                  isAssigned
                    ? `
                      background:${color};
                      box-shadow:
                        0 0 0 2px ${color},
                        0 5px 12px rgba(16,42,67,.2);
                    `
                    : ""
                }"
                onclick="toggleBuilderPoint(${point})"
                ${isAssigned ? "disabled" : ""}
                aria-label="Point ${point}"
              >
                ${point}
              </button>

              <span class="dot-number">
                ${
                  isAssigned
                    ? `Class ${classIndex + 1}`
                    : "Free"
                }
              </span>
            </div>
          `;
        })
        .join("");

      if (builder.classes.length === 0) {
        classList.innerHTML = `
          <span class="empty-message">
            No classes have been added yet.
          </span>
        `;
      } else {
        classList.innerHTML = builder.classes
          .map((group, index) => `
            <button
              class="class-pill"
              style="
                background:
                  ${CLASS_COLORS[index % CLASS_COLORS.length]}
              "
              onclick="removeBuilderClass(${index})"
              title="Remove this class"
            >
              {${[...group].sort((a, b) => a - b).join(", ")}}
            </button>
          `)
          .join("");
      }

      const result = validateBuilder();

      validation.className =
        `validation ${result.valid ? "good" : "bad"}`;

      validation.textContent = result.message;

      const saveButton =
        document.getElementById("savePartitionButton");

      const declareButton =
        document.getElementById("submitDeclarationButton");

      if (saveButton) {
        saveButton.disabled = !result.valid;
      }

      if (declareButton) {
        declareButton.disabled = !result.valid;
      }
    }

    function toggleBuilderPoint(point) {
      if (assignedPoints().has(point)) return;

      if (builder.selected.has(point)) {
        builder.selected.delete(point);
      } else {
        builder.selected.add(point);
      }

      updateBuilderView();
    }

    function addSelectedClass() {
      if (builder.selected.size === 0) return;

      builder.classes.push(
        [...builder.selected].sort((a, b) => a - b)
      );

      builder.selected.clear();
      updateBuilderView();
    }

    function completeSingletons() {
      if (builder.selected.size > 0) {
        builder.classes.push(
          [...builder.selected].sort((a, b) => a - b)
        );

        builder.selected.clear();
      }

      const assigned = assignedPoints();

      for (let point = 0; point < state.size; point++) {
        if (!assigned.has(point)) {
          builder.classes.push([point]);
        }
      }

      updateBuilderView();
    }

    function removeBuilderClass(index) {
      builder.classes.splice(index, 1);
      updateBuilderView();
    }

    function clearBuilder() {
      builder.classes = [];
      builder.selected.clear();
      updateBuilderView();
    }

    function validateBuilder() {
      const points = builder.classes.flat();
      const uniquePoints = new Set(points);

      if (builder.selected.size > 0) {
        return {
          valid: false,
          message:
            "Add the currently selected points as a class."
        };
      }

      if (
        points.length !== state.size ||
        uniquePoints.size !== state.size
      ) {
        return {
          valid: false,
          message:
            "Every point must belong to exactly one class."
        };
      }

      if (
        !matchesRule(
          builder.classes,
          state.ruleId,
          state.size
        )
      ) {
        return {
          valid: false,
          message:
            "This partition does not satisfy the selected rule card."
        };
      }

      return {
        valid: true,
        message: "Valid partition. It is ready to save."
      };
    }

    function saveSecretPartition() {
      const result = validateBuilder();

      if (!result.valid) return;

      state.players[state.setupPlayer].secret =
        normalizePartition(builder.classes);

      if (state.mode === "ai") {
        const possibleSecrets =
          getCandidates(state.size, state.ruleId);

        const randomSecretCode = randomChoice(possibleSecrets);

        state.players[1].secret =
          codeToPartition(randomSecretCode, state.size);

        startGame();
        return;
      }

      if (state.setupPlayer === 0) {
        state.setupPlayer = 1;
        initializeBuilder("setup");

        showPrivacyOverlay(
          "Pass the device",
          "Player 1’s partition has been hidden. Give the device to Player 2.",
          "Player 2 is ready",
          () => render()
        );
      } else {
        startGame();
      }
    }

    function startGame() {
      const allCandidates =
        getCandidates(state.size, state.ruleId);

      state.candidates = [
        [...allCandidates],
        [...allCandidates]
      ];

      state.manualMarks = [{}, {}];
      state.questionSelection = [];
      state.questionCounts = [0, 0];
      state.log = [];
      state.current = 0;
      state.winner = null;
      state.screen = "game";
      builder = null;

      render();

      if (state.mode === "pvp") {
        showTurnPrivacyScreen();
      }
    }

    function playerName(index) {
      return state.players[index].name;
    }

    function renderGame() {
      const actor = state.current;

      const rule = ruleById(state.ruleId);

      const computerTurn =

      document.getElementById("app").innerHTML = `
        <div class="status-bar">
          <div>
            Current turn:
            <strong>${escapeHtml(playerName(actor))}</strong>
          </div>

          <div>
            Card ${rule.id}:

        <section class="game-grid">

            </h2>

            <div class="action-box">

              </div>

              <div class="button-row">
                <button

                  onclick="askSelectedQuestion()"

                    computerTurn ||
                    state.questionSelection.length !== 2
                      ? "disabled"
                      : ""
                  }

                  Ask question
                </button>

                <button
                  class="btn btn-secondary"

                  ${

                    state.questionSelection.length === 0
                      ? "disabled"

                  }

                  Clear
                </button>
              </div>

            <div class="action-box">
              <h3>Declare the complete partition</h3>

              <p class="small-note">
                A correct declaration wins. An incorrect declaration loses

              </p>

              <button
                class="btn btn-warning"
                onclick="openDeclarationBuilder()"

              >
                Declare partition
              </button>
            </div>

            <div class="action-box">
              <h3>Your deduction notebook</h3>

              ${
                state.deductionMode === "manual"
                  ? `

                      <strong>unknown</strong>,

                    </p>
                  `
                  : `

                      <strong>
                        ${state.candidates[actor].length.toLocaleString()}
                      </strong>

                    <p class="small-note">
                      The game automatically applies deductions from all
                      answers and from the selected rule card.
                    </p>
                  `
              }

              <div class="legend">
                <span>
                  <i
                    class="legend-mark"
                    style="background:#e8f8f0"
                  ></i>
                  Equivalent
                </span>

                  <i
                    class="legend-mark"
                    style="background:#fff0f0"
                  ></i>
                  Not equivalent
                </span>

                <span>
                  <i
                    class="legend-mark"
                    style="
                      background:white;
                      border:1px solid #d7e0e8
                    "
                  ></i>
                  Unknown
                </span>
              </div>

              <div class="knowledge-grid">
                ${knowledgeMarkup(actor)}
              </div>
            </div>
          </div>

          <aside class="card">
            <h2>Game record</h2>

            <div class="score-row">
              <div class="score-box">
                ${escapeHtml(playerName(0))}
                <strong>${state.questionCounts[0]}</strong>
                <span class="small-note">questions</span>
              </div>

              <div class="score-box">
                ${escapeHtml(playerName(1))}
                <strong>${state.questionCounts[1]}</strong>
                <span class="small-note">questions</span>
              </div>
            </div>

            <div class="log" style="margin-top:18px">
              ${
                state.log.length === 0
                  ? `
                    <p class="empty-message">

                  : state.log.map(logEntryMarkup).join("")
              }
            </div>
          </aside>
        </section>
      `;
    }

    function questionPointButtons(computerTurn) {
      return Array
        .from({ length: state.size }, (_, point) => `
          <button
            class="pick-point ${
              state.questionSelection.includes(point)
                ? "selected"
                : ""
            }"
            onclick="toggleQuestionPoint(${point})"
            ${computerTurn ? "disabled" : ""}
            aria-label="Select point ${point}"
          >
            ${point}
          </button>
        `)
        .join("");
    }

    function questionPreview(computerTurn) {
      if (computerTurn) {
        return "The computer is choosing a question…";
      }

      if (state.questionSelection.length === 0) {
        return "Select two points.";
      }

      if (state.questionSelection.length === 1) {
        return `
          Selected point ${state.questionSelection[0]}.
          Select one more.
        `;
      }

      const [a, b] = state.questionSelection;

      return `Ask: Is ${a} ∼ ${b}?`;
    }

    function toggleQuestionPoint(point) {
      if (
        state.mode === "ai" &&
        state.current === 1
      ) {
        return;
      }

      const index =
        state.questionSelection.indexOf(point);

      if (index >= 0) {
        state.questionSelection.splice(index, 1);
      } else if (state.questionSelection.length < 2) {
        state.questionSelection.push(point);
      } else {
        state.questionSelection.shift();
        state.questionSelection.push(point);
      }

      render();
    }

    function clearQuestionSelection() {
      state.questionSelection = [];
      render();
    }

    function askSelectedQuestion() {
      if (state.questionSelection.length !== 2) return;

      const [a, b] = state.questionSelection;

      state.questionSelection = [];
      resolveQuestion(state.current, a, b);
    }

    function resolveQuestion(actor, a, b) {
      const target = 1 - actor;

      const answer = sameClassPartition(
        state.players[target].secret,
        a,
        b
      );

      state.questionCounts[actor]++;

      state.candidates[actor] =
        state.candidates[actor].filter(
          code => sameClassCode(code, a, b) === answer
        );

      state.log.unshift({
        type: "question",
        actor: playerName(actor),
        a,
        b,
        answer
      });

      state.current = target;
      state.questionSelection = [];

      render();

      if (
        state.mode === "ai" &&
        state.current === 1
      ) {
        window.setTimeout(computerTurn, 700);
      } else if (state.mode === "pvp") {
        showTurnPrivacyScreen();
      }
    }

    function pairKey(a, b) {
      return a < b ? `${a}-${b}` : `${b}-${a}`;
    }

    function cycleManualMark(playerIndex, a, b) {
      if (state.deductionMode !== "manual") return;
      if (playerIndex !== state.current) return;

      if (
        state.mode === "ai" &&
        playerIndex === 1
      ) {
        return;
      }

      const key = pairKey(a, b);
      const currentMark =
        state.manualMarks[playerIndex][key];

      if (!currentMark) {
        state.manualMarks[playerIndex][key] = "yes";
      } else if (currentMark === "yes") {
        state.manualMarks[playerIndex][key] = "no";
      } else {
        delete state.manualMarks[playerIndex][key];
      }

      render();
    }

    function knowledgeMarkup(playerIndex) {
      if (state.deductionMode === "manual") {
        const notes = state.manualMarks[playerIndex];
        const cells = [];

        for (let a = 0; a < state.size; a++) {
          for (let b = a + 1; b < state.size; b++) {
            const key = pairKey(a, b);
            const mark = notes[key] || "unknown";

            let symbol = "?";
            let description = "Unknown";

            if (mark === "yes") {
              symbol = "✓";
              description = "Equivalent";
            } else if (mark === "no") {
              symbol = "×";
              description = "Not equivalent";
            }

            cells.push(`
              <button
                type="button"
                class="knowledge-cell ${mark}"
                onclick="
                  cycleManualMark(${playerIndex}, ${a}, ${b})
                "
                title="${description}. Click to change."
              >
                <span>${a} ∼ ${b}</span>
                <strong>${symbol}</strong>
              </button>
            `);
          }
        }

        return cells.join("");
      }

      const candidates = state.candidates[playerIndex];

      if (candidates.length === 0) {
        return `
          <div class="knowledge-cell no">
            Contradiction
          </div>
        `;
      }

      const cells = [];

      for (let a = 0; a < state.size; a++) {
        for (let b = a + 1; b < state.size; b++) {
          let yesCount = 0;

          for (const code of candidates) {
            if (sameClassCode(code, a, b)) {
              yesCount++;
            }
          }

          let status = "unknown";
          let symbol = "?";

          if (yesCount === candidates.length) {
            status = "yes";
            symbol = "✓";
          } else if (yesCount === 0) {
            status = "no";
            symbol = "×";
          }

          cells.push(`
            <div class="knowledge-cell ${status}">
              ${a} ∼ ${b} &nbsp; ${symbol}
            </div>
          `);
        }
      }

      return cells.join("");
    }

    function allInformativePairs(candidates) {
      const pairs = [];

      for (let a = 0; a < state.size; a++) {
        for (let b = a + 1; b < state.size; b++) {
          let yes = 0;

          for (const code of candidates) {
            if (sameClassCode(code, a, b)) {
              yes++;
            }
          }

          const no = candidates.length - yes;

          if (yes > 0 && no > 0) {
            pairs.push({
              a,
              b,
              yes,
              no,
              score: Math.min(yes, no)
            });
          }
        }
      }

      return pairs;
    }

    function chooseComputerQuestion() {
      const candidates = state.candidates[1];
      const pairs = allInformativePairs(candidates);

      if (pairs.length === 0) {
        return null;
      }

      if (state.difficulty === "easy") {
        return randomChoice(pairs);
      }

      pairs.sort((first, second) =>
        second.score - first.score
      );

      if (state.difficulty === "medium") {
        const topCount = Math.min(6, pairs.length);
        return randomChoice(pairs.slice(0, topCount));
      }

      return pairs[0];
    }

    function computerTurn() {
      if (
        state.screen !== "game" ||
        state.current !== 1
      ) {
        return;
      }

      const candidates = state.candidates[1];

      if (candidates.length === 1) {
        finishDeclaration(
          1,
          codeToPartition(candidates[0], state.size)
        );

        return;
      }

      const pair = chooseComputerQuestion();

      if (!pair) {
        finishDeclaration(
          1,
          codeToPartition(candidates[0], state.size)
        );

        return;
      }

      resolveQuestion(1, pair.a, pair.b);
    }

    function openDeclarationBuilder() {
      initializeBuilder("declaration");

      const modal = document.getElementById("modal");

      modal.classList.remove("hidden");

      modal.innerHTML = `
        <div class="modal-card">
          <h2>Declare the hidden partition</h2>

          <p class="small-note">
            Build the complete partition you believe your opponent selected.
            An incorrect declaration loses the game.
          </p>

          ${builderMarkup()}

          <div class="button-row">
            <button
              id="submitDeclarationButton"
              class="btn btn-warning"
              onclick="submitDeclaration()"
            >
              Submit declaration
            </button>

            <button
              class="btn btn-secondary"
              onclick="closeModal()"
            >
              Keep investigating
            </button>
          </div>
        </div>
      `;

      updateBuilderView();
    }

    function closeModal() {
      const modal = document.getElementById("modal");

      modal.classList.add("hidden");
      modal.innerHTML = "";
      builder = null;
    }

    function submitDeclaration() {
      const result = validateBuilder();

      if (!result.valid) return;

      const declared =
        normalizePartition(builder.classes);

      closeModal();
      finishDeclaration(state.current, declared);
    }

    function finishDeclaration(actor, declaredPartition) {
      const target = 1 - actor;

      const correct =
        partitionKey(declaredPartition) ===
        partitionKey(state.players[target].secret);

      state.log.unshift({
        type: "declaration",
        actor: playerName(actor),
        correct
      });

      state.winner = correct ? actor : target;
      state.screen = "finished";

      render();
    }

    function logEntryMarkup(entry) {
      if (entry.type === "question") {
        return `
          <div class="log-entry">
            <strong>${escapeHtml(entry.actor)}</strong>
            asked: Is ${entry.a} ∼ ${entry.b}?

            <small>
              Answer:
              <strong>${entry.answer ? "Yes" : "No"}</strong>
            </small>
          </div>
        `;
      }

      return `
        <div class="log-entry declare">
          <strong>${escapeHtml(entry.actor)}</strong>
          declared a partition.

          <small>
            ${
              entry.correct
                ? "The declaration was correct."
                : "The declaration was incorrect."
            }
          </small>
        </div>
      `;
    }

    function renderFinished() {
      const winner = state.winner;
      const loser = 1 - winner;
      const declarationCorrect =
        state.log[0] && state.log[0].correct;

      document.getElementById("app").innerHTML = `
        <section
          class="card"
          style="
            max-width:800px;
            margin:0 auto;
            text-align:center
          "
        >
          <div class="logo" style="margin:0 auto 16px">
            ${declarationCorrect ? "✓" : "!"}
          </div>

          <h2>
            ${escapeHtml(playerName(winner))} wins!
          </h2>

          <p>
            ${
              declarationCorrect
                ? `
                  ${escapeHtml(playerName(winner))}
                  correctly identified the hidden partition.
                `
                : `
                  ${escapeHtml(playerName(loser))}
                  made an incorrect declaration.
                `
            }
          </p>

          <div class="result-partitions">
            <div class="result-partition">
              <strong>
                ${escapeHtml(playerName(0))}’s partition
              </strong>

              <div>
                ${formatPartition(state.players[0].secret)}
              </div>
            </div>

            <div class="result-partition">
              <strong>
                ${escapeHtml(playerName(1))}’s partition
              </strong>

              <div>
                ${formatPartition(state.players[1].secret)}
              </div>
            </div>
          </div>

          <div class="score-row">
            <div class="score-box">
              ${escapeHtml(playerName(0))}
              <strong>${state.questionCounts[0]}</strong>
              <span class="small-note">questions asked</span>
            </div>

            <div class="score-box">
              ${escapeHtml(playerName(1))}
              <strong>${state.questionCounts[1]}</strong>
              <span class="small-note">questions asked</span>
            </div>
          </div>

          <div
            class="button-row"
            style="justify-content:center"
          >
            <button
              class="btn btn-primary"
              onclick="playAgain()"
            >
              Play again
            </button>

            <button
              class="btn btn-secondary"
              onclick="returnToSetup()"
            >
              Change settings
            </button>
          </div>
        </section>
      `;
    }

    function playAgain() {
      state.players[0].secret = null;
      state.players[1].secret = null;
      state.setupPlayer = 0;
      state.screen = "secret";

      initializeBuilder("setup");
      render();
    }

    function returnToSetup() {
      closeModal();

      state.screen = "setup";
      builder = null;

      render();
    }

    function showPrivacyOverlay(
      title,
      message,
      buttonText,
      callback
    ) {
      const overlay =
        document.getElementById("privacyOverlay");

      overlay.classList.remove("hidden");

      overlay.innerHTML = `
        <div class="overlay-card">
          <div class="logo">≈</div>

          <h2>${escapeHtml(title)}</h2>
          <p>${escapeHtml(message)}</p>

          <button
            id="privacyContinue"
            class="btn btn-primary"
          >
            ${escapeHtml(buttonText)}
          </button>
        </div>
      `;

      document.getElementById("privacyContinue").onclick =
        () => {
          overlay.classList.add("hidden");
          overlay.innerHTML = "";
          callback();
        };
    }

    function showTurnPrivacyScreen() {
      const name = playerName(state.current);

      showPrivacyOverlay(
        `${name}’s turn`,
        `Pass the device to ${name}. The other player should look away.`,
        "Begin turn",
        () => render()
      );
    }

    render();
  </script>
</body>
</html>
