<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Equivalence Battleship</title>

  <style>
    :root {
      --navy: #102a43;
      --navy-2: #183b56;
      --blue: #247ba0;
      --blue-light: #d9eef7;
      --orange: #f59e0b;
      --orange-dark: #c56f00;
      --green: #2e9d68;
      --red: #d64545;
      --paper: #f5f8fb;
      --white: #ffffff;
      --ink: #1f2933;
      --muted: #64748b;
      --border: #d7e0e8;
      --shadow: 0 14px 35px rgba(16, 42, 67, 0.12);
      --radius: 18px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family:
        Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at top left, rgba(36, 123, 160, 0.13), transparent 32rem),
        linear-gradient(180deg, #eef6fa 0%, var(--paper) 45%, #edf2f7 100%);
    }

    button,
    select,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.48;
    }

    .app-shell {
      width: min(1180px, calc(100% - 28px));
      margin: 0 auto;
      padding: 26px 0 50px;
    }

    .hero {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 22px;
      margin-bottom: 24px;
    }

    .hero-title {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .logo {
      display: grid;
      place-items: center;
      width: 58px;
      height: 58px;
      border-radius: 17px;
      color: white;
      font-size: 29px;
      background: linear-gradient(145deg, var(--navy), var(--blue));
      box-shadow: var(--shadow);
    }

    h1,
    h2,
    h3,
    p {
      margin-top: 0;
    }

    h1 {
      margin-bottom: 4px;
      color: var(--navy);
      font-size: clamp(1.65rem, 4vw, 2.45rem);
      line-height: 1.05;
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
    }

    .card {
      padding: 22px;
      border: 1px solid rgba(215, 224, 232, 0.9);
      border-radius: var(--radius);
      background: rgba(255, 255, 255, 0.93);
      box-shadow: var(--shadow);
    }

    .setup-grid,
    .game-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.25fr) minmax(290px, 0.75fr);
      gap: 20px;
    }

    .field-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 15px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .field.full {
      grid-column: 1 / -1;
    }

    label,
    .label {
      color: var(--navy);
      font-size: 0.86rem;
      font-weight: 750;
    }

    select,
    input[type="text"] {
      width: 100%;
      min-height: 45px;
      padding: 9px 12px;
      border: 1px solid var(--border);
      border-radius: 11px;
      color: var(--ink);
      background: white;
    }

    select:focus,
    input:focus,
    button:focus-visible {
      outline: 3px solid rgba(36, 123, 160, 0.25);
      outline-offset: 2px;
    }

    .rule-card {
      margin-top: 18px;
      padding: 18px;
      border: 1px solid #c8e2ed;
      border-left: 6px solid var(--blue);
      border-radius: 14px;
      background: #f2fbff;
    }

    .rule-card h3 {
      margin-bottom: 7px;
      color: var(--navy);
    }

    .rule-card p {
      margin-bottom: 8px;
      line-height: 1.55;
    }

    .stars {
      color: var(--orange-dark);
      letter-spacing: 2px;
    }

    .candidate-count,
    .small-note {
      color: var(--muted);
      font-size: 0.87rem;
    }

    .button-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      margin-top: 18px;
    }

    .btn {
      min-height: 43px;
      padding: 10px 16px;
      border: 0;
      border-radius: 11px;
      font-weight: 760;
      transition:
        transform 120ms ease,
        box-shadow 120ms ease,
        background 120ms ease;
    }

    .btn:hover:not(:disabled) {
      transform: translateY(-1px);
    }

    .btn-primary {
      color: white;
      background: linear-gradient(135deg, var(--blue), #1b6f92);
      box-shadow: 0 8px 18px rgba(36, 123, 160, 0.22);
    }

    .btn-secondary {
      color: var(--navy);
      border: 1px solid var(--border);
      background: white;
    }

    .btn-warning {
      color: white;
      background: linear-gradient(135deg, var(--orange), var(--orange-dark));
    }

    .btn-danger {
      color: white;
      background: var(--red);
    }

    .rules-list {
      display: grid;
      gap: 10px;
    }

    .mini-rule {
      padding: 13px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: white;
    }

    .mini-rule strong {
      color: var(--navy);
    }

    .mini-rule p {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 0.9rem;
      line-height: 1.45;
    }

    .builder-title {
      margin-bottom: 6px;
    }

    .builder-help {
      margin-bottom: 20px;
      color: var(--muted);
      line-height: 1.5;
    }

    .dot-line {
      position: relative;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 6px;
      margin: 26px 0 24px;
      padding: 0 8px;
    }

    .dot-line::before {
      position: absolute;
      z-index: 0;
      top: 20px;
      right: 26px;
      left: 26px;
      height: 4px;
      border-radius: 3px;
      background: #d7e0e8;
      content: "";
    }

    .dot-wrap {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 7px;
    }

    .dot {
      display: grid;
      place-items: center;
      width: 42px;
      height: 42px;
      padding: 0;
      border: 4px solid white;
      border-radius: 50%;
      color: white;
      font-weight: 850;
      background: var(--navy);
      box-shadow:
        0 0 0 2px var(--navy),
        0 5px 12px rgba(16, 42, 67, 0.2);
    }

    .dot.selected {
      color: var(--navy);
      background: var(--orange);
      box-shadow:
        0 0 0 3px #ffd991,
        0 6px 15px rgba(245, 158, 11, 0.28);
    }

    .dot.assigned {
      opacity: 0.94;
    }

    .dot-number {
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 700;
    }

    .partition-preview {
      min-height: 80px;
      margin-top: 12px;
      padding: 14px;
      border: 1px dashed #b8c8d5;
      border-radius: 13px;
      background: #f8fafc;
    }

    .class-list {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
    }

    .class-pill {
      padding: 9px 12px;
      border: 0;
      border-radius: 999px;
      color: white;
      font-weight: 780;
      box-shadow: 0 5px 11px rgba(31, 41, 51, 0.12);
    }

    .empty-message {
      color: var(--muted);
      font-style: italic;
    }

    .validation {
      min-height: 24px;
      margin-top: 11px;
      font-size: 0.9rem;
      font-weight: 700;
    }

    .validation.good {
      color: var(--green);
    }

    .validation.bad {
      color: var(--red);
    }

    .status-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 20px;
      padding: 15px 18px;
      border-radius: 15px;
      color: white;
      background: linear-gradient(135deg, var(--navy), var(--navy-2));
      box-shadow: var(--shadow);
    }

    .status-bar strong {
      color: #ffd27a;
    }

    .action-box {
      margin-bottom: 18px;
      padding: 18px;
      border: 1px solid var(--border);
      border-radius: 15px;
      background: #fbfdff;
    }

    .question-row {
      display: grid;
      grid-template-columns: 1fr auto 1fr auto;
      align-items: center;
      gap: 10px;
    }

    .relation-symbol {
      color: var(--navy);
      font-size: 1.55rem;
      font-weight: 850;
    }

    .knowledge-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(76px, 1fr));
      gap: 7px;
      margin-top: 13px;
    }

    .knowledge-cell {
      padding: 8px 5px;
      border: 1px solid var(--border);
      border-radius: 9px;
      text-align: center;
      font-size: 0.8rem;
      font-weight: 730;
      background: white;
    }

    .knowledge-cell.yes {
      color: #176b46;
      border-color: #9bd8bd;
      background: #e8f8f0;
    }

    .knowledge-cell.no {
      color: #9e2d2d;
      border-color: #f0b4b4;
      background: #fff0f0;
    }

    .knowledge-cell.unknown {
      color: var(--muted);
    }

    .log {
      display: grid;
      gap: 9px;
      max-height: 520px;
      overflow: auto;
      padding-right: 5px;
    }

    .log-entry {
      padding: 12px;
      border-left: 4px solid var(--blue);
      border-radius: 10px;
      background: #f5f9fc;
      line-height: 1.45;
    }

    .log-entry.declare {
      border-left-color: var(--orange);
      background: #fff8e8;
    }

    .log-entry small {
      display: block;
      margin-top: 4px;
      color: var(--muted);
    }

    .score-row {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-top: 15px;
    }

    .score-box {
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 12px;
      text-align: center;
      background: white;
    }

    .score-box strong {
      display: block;
      margin-top: 3px;
      color: var(--navy);
      font-size: 1.4rem;
    }

    .overlay,
    .modal {
      position: fixed;
      z-index: 100;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 18px;
      background: rgba(5, 20, 33, 0.76);
      backdrop-filter: blur(7px);
    }

    .hidden {
      display: none !important;
    }

    .overlay-card,
    .modal-card {
      width: min(720px, 100%);
      max-height: calc(100vh - 36px);
      overflow: auto;
      padding: 26px;
      border-radius: 20px;
      background: white;
      box-shadow: 0 26px 70px rgba(0, 0, 0, 0.3);
    }

    .overlay-card {
      width: min(520px, 100%);
      text-align: center;
    }

    .overlay-card .logo {
      margin: 0 auto 16px;
    }

    .result-partitions {
      display: grid;
      gap: 12px;
      margin: 18px 0;
      text-align: left;
    }

    .result-partition {
      padding: 13px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #f8fafc;
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 10px;
      color: var(--muted);
      font-size: 0.82rem;
    }

    .legend span {
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .legend-mark {
      width: 12px;
      height: 12px;
      border-radius: 3px;
    }

    @media (max-width: 820px) {
      .setup-grid,
      .game-grid {
        grid-template-columns: 1fr;
      }

      .hero {
        align-items: flex-start;
        flex-direction: column;
      }
    }

    @media (max-width: 590px) {
      .field-grid {
        grid-template-columns: 1fr;
      }

      .field.full {
        grid-column: auto;
      }

      .question-row {
        grid-template-columns: 1fr auto 1fr;
      }

      .question-row .btn {
        grid-column: 1 / -1;
      }

      .dot {
        width: 34px;
        height: 34px;
        border-width: 3px;
        font-size: 0.8rem;
      }

      .dot-line::before {
        top: 16px;
      }

      .card {
        padding: 17px;
      }
    }
  </style>
</head>

<body>
  <main class="app-shell">
    <header class="hero">
      <div class="hero-title">
        <div class="logo" aria-hidden="true">≈</div>
        <div>
          <h1>Equivalence Battleship</h1>
          <p class="subtitle">
            Discover the opponent’s hidden partition using equivalence questions.
          </p>
        </div>
      </div>
    </header>

    <div id="app"></div>
  </main>

  <div id="privacyOverlay" class="overlay hidden"></div>
  <div id="modal" class="modal hidden"></div>

  <script>
    "use strict";

    const CLASS_COLORS = [
      "#247ba0",
      "#d97706",
      "#2e9d68",
      "#8b5cf6",
      "#d64545",
      "#0f766e",
      "#be185d",
      "#4f46e5",
      "#64748b"
    ];

    const RULES = [
      {
        id: 1,
        stars: 1,
        name: "Two equal-sized classes",
        description:
          "There are exactly two equivalence classes, and they contain the same number of points."
      },
      {
        id: 2,
        stars: 2,
        name: "Pairs",
        description:
          "Every equivalence class contains exactly two points."
      },
      {
        id: 3,
        stars: 2,
        name: "Exactly two classes",
        description:
          "There are exactly two equivalence classes. Their sizes may be different."
      },
      {
        id: 4,
        stars: 1,
        name: "One class of three",
        description:
          "One class contains exactly three points. Every other point is a singleton."
      },
      {
        id: 5,
        stars: 2,
        name: "One non-singleton class",
        description:
          "Exactly one class contains at least two points. Every other point is a singleton."
      },
      {
        id: 6,
        stars: 3,
        name: "Two non-singleton classes",
        description:
          "Exactly two classes contain at least two points. Every other point is a singleton."
      },
      {
        id: 7,
        stars: 2,
        name: "Consecutive classes",
        description:
          "Every class consists of consecutive points on the number line."
      },
      {
        id: 8,
        stars: 1,
        name: "Equal consecutive classes",
        description:
          "Every class consists of consecutive points, and all classes have equal size."
      },
      {
        id: 9,
        stars: 3,
        name: "Exactly three classes",
        description:
          "The partition has exactly three equivalence classes."
      },
      {
        id: 10,
        stars: 2,
        name: "Equal-sized classes",
        description:
          "All equivalence classes have the same number of points."
      },
      {
        id: 11,
        stars: 3,
        name: "No singleton classes",
        description:
          "Every equivalence class contains at least two points."
      },
      {
        id: 12,
        stars: 1,
        name: "Remainders modulo n",
        description:
          "Two points are equivalent exactly when they have the same remainder after division by a hidden n."
      }
    ];

    let state = {
      screen: "setup",
      mode: "ai",
      size: 9,
      ruleId: 3,
      difficulty: "medium",
      players: [],
      setupPlayer: 0,
      current: 0,
      candidates: [[], []],
      log: [],
      questionCounts: [0, 0],
      winner: null
    };

    let builder = null;
    const partitionCache = new Map();
    const candidateCache = new Map();

    function ruleById(id) {
      return RULES.find(rule => rule.id === Number(id));
    }

    function stars(count) {
      return "★".repeat(count);
    }

    function normalizePartition(partition) {
      return partition
        .map(group => [...group].sort((a, b) => a - b))
        .sort((a, b) => a[0] - b[0]);
    }

    function partitionKey(partition) {
      return JSON.stringify(normalizePartition(partition));
    }

    function formatPartition(partition) {
      return normalizePartition(partition)
        .map(group => `{${group.join(", ")}}`)
        .join("  ");
    }

    function generatePartitions(size) {
      if (partitionCache.has(size)) {
        return partitionCache.get(size);
      }

      const output = [];

      function recurse(point, groups) {
        if (point === size) {
          output.push(groups.map(group => [...group]));
          return;
        }

        for (let i = 0; i < groups.length; i++) {
          groups[i].push(point);
          recurse(point + 1, groups);
          groups[i].pop();
        }

        groups.push([point]);
        recurse(point + 1, groups);
        groups.pop();
      }

      recurse(0, []);
      partitionCache.set(size, output);
      return output;
    }

    function isConsecutive(group) {
      const sorted = [...group].sort((a, b) => a - b);

      for (let i = 1; i < sorted.length; i++) {
        if (sorted[i] !== sorted[i - 1] + 1) {
          return false;
        }
      }

      return true;
    }

    function moduloPartition(size, modulus) {
      const groups = Array.from({ length: modulus }, () => []);

      for (let point = 0; point < size; point++) {
        groups[point % modulus].push(point);
      }

      return groups.filter(group => group.length > 0);
    }

    function matchesRule(partition, ruleId, size) {
      const groups = normalizePartition(partition);
      const sizes = groups.map(group => group.length);
      const nonSingletons = groups.filter(group => group.length >= 2);
      const allConsecutive = groups.every(isConsecutive);
      const allEqual = sizes.every(value => value === sizes[0]);

      switch (Number(ruleId)) {
        case 1:
          return groups.length === 2 && sizes[0] === sizes[1];

        case 2:
          return groups.length > 0 && sizes.every(value => value === 2);

        case 3:
          return groups.length === 2;

        case 4:
          return (
            sizes.filter(value => value === 3).length === 1 &&
            sizes.every(value => value === 1 || value === 3)
          );

        case 5:
          return nonSingletons.length === 1;

        case 6:
          return nonSingletons.length === 2;

        case 7:
          return allConsecutive;

        case 8:
          return allConsecutive && allEqual;

        case 9:
          return groups.length === 3;

        case 10:
          return allEqual;

        case 11:
          return sizes.every(value => value >= 2);

        case 12: {
          const key = partitionKey(groups);

          for (let modulus = 1; modulus <= size; modulus++) {
            if (partitionKey(moduloPartition(size, modulus)) === key) {
              return true;
            }
          }

          return false;
        }

        default:
          return false;
      }
    }

    function getCandidates(size, ruleId) {
      const cacheKey = `${size}-${ruleId}`;

      if (!candidateCache.has(cacheKey)) {
        const candidates = generatePartitions(size).filter(partition =>
          matchesRule(partition, ruleId, size)
        );

        candidateCache.set(cacheKey, candidates);
      }

      return candidateCache.get(cacheKey);
    }

    function sameClass(partition, a, b) {
      return partition.some(group => group.includes(a) && group.includes(b));
    }

    function randomChoice(items) {
      return items[Math.floor(Math.random() * items.length)];
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function render() {
      if (state.screen === "setup") {
        renderSetup();
      } else if (state.screen === "secret") {
        renderSecretSetup();
      } else if (state.screen === "game") {
        renderGame();
      } else if (state.screen === "finished") {
        renderFinished();
      }
    }

    function renderSetup() {
      const selectedRule = ruleById(state.ruleId);
      const candidateCount = getCandidates(state.size, state.ruleId).length;

      document.getElementById("app").innerHTML = `
        <section class="setup-grid">
          <div class="card">
            <h2>Start a new game</h2>
            <p class="small-note">
              Both players use the same rule card but create different secret partitions.
            </p>

            <div class="field-grid">
              <div class="field">
                <label for="mode">Game mode</label>
                <select id="mode" onchange="updateSetting('mode', this.value)">
                  <option value="ai" ${state.mode === "ai" ? "selected" : ""}>
                    Player vs. computer
                  </option>
                  <option value="pvp" ${state.mode === "pvp" ? "selected" : ""}>
                    Two players — pass and play
                  </option>
                </select>
              </div>

              <div class="field">
                <label for="boardSize">Number of points</label>
                <select id="boardSize" onchange="changeBoardSize(this.value)">
                  <option value="8" ${state.size === 8 ? "selected" : ""}>
                    8 points: 0–7
                  </option>
                  <option value="9" ${state.size === 9 ? "selected" : ""}>
                    9 points: 0–8
                  </option>
                </select>
              </div>

              <div class="field">
                <label for="difficulty">Computer difficulty</label>
                <select
                  id="difficulty"
                  onchange="updateSetting('difficulty', this.value)"
                  ${state.mode !== "ai" ? "disabled" : ""}
                >
                  <option value="easy" ${state.difficulty === "easy" ? "selected" : ""}>
                    Easy — random useful questions
                  </option>
                  <option value="medium" ${state.difficulty === "medium" ? "selected" : ""}>
                    Medium — good balanced questions
                  </option>
                  <option value="hard" ${state.difficulty === "hard" ? "selected" : ""}>
                    Hard — strongest information split
                  </option>
                </select>
              </div>

              <div class="field">
                <label for="rule">Rule card</label>
                <select id="rule" onchange="changeRule(this.value)">
                  ${RULES.map(rule => {
                    const count = getCandidates(state.size, rule.id).length;
                    return `
                      <option
                        value="${rule.id}"
                        ${state.ruleId === rule.id ? "selected" : ""}
                        ${count === 0 ? "disabled" : ""}
                      >
                        Card ${rule.id}: ${rule.name}${count === 0 ? " — unavailable" : ""}
                      </option>
                    `;
                  }).join("")}
                </select>
              </div>
            </div>

            <article class="rule-card">
              <h3>
                Card ${selectedRule.id}: ${selectedRule.name}
                <span class="stars">${stars(selectedRule.stars)}</span>
              </h3>
              <p>${selectedRule.description}</p>
              <div class="candidate-count">
                ${candidateCount.toLocaleString()} valid partition${
                  candidateCount === 1 ? "" : "s"
                } on this board.
              </div>
            </article>

            <div class="button-row">
              <button class="btn btn-primary" onclick="beginSecretSetup()">
                Build secret partition
              </button>
            </div>
          </div>

          <aside class="card">
            <h2>How to play</h2>

            <div class="rules-list">
              <div class="mini-rule">
                <strong>1. Create a partition</strong>
                <p>
                  Group the points into equivalence classes that satisfy the selected card.
                </p>
              </div>

              <div class="mini-rule">
                <strong>2. Ask one question</strong>
                <p>
                  Ask whether two points are equivalent, for example
                  “Is 2 ∼ 6?”
                </p>
              </div>

              <div class="mini-rule">
                <strong>3. Use equivalence properties</strong>
                <p>
                  Reflexivity, symmetry, and transitivity give you information without
                  requiring every possible question.
                </p>
              </div>

              <div class="mini-rule">
                <strong>4. Declare when certain</strong>
                <p>
                  You win by declaring the complete hidden partition correctly.
                  An incorrect declaration loses immediately.
                </p>
              </div>
            </div>
          </aside>
        </section>
      `;
    }

    function updateSetting(key, value) {
      state[key] = value;
      render();
    }

    function changeBoardSize(value) {
      state.size = Number(value);

      if (getCandidates(state.size, state.ruleId).length === 0) {
        const firstAvailable = RULES.find(
          rule => getCandidates(state.size, rule.id).length > 0
        );

        state.ruleId = firstAvailable.id;
      }

      render();
    }

    function changeRule(value) {
      state.ruleId = Number(value);
      render();
    }

    function beginSecretSetup() {
      state.players = [
        { name: "Player 1", secret: null },
        {
          name: state.mode === "ai" ? "Computer" : "Player 2",
          secret: null
        }
      ];

      state.setupPlayer = 0;
      state.screen = "secret";
      initializeBuilder("setup");
      render();
    }

    function initializeBuilder(context) {
      builder = {
        context,
        classes: [],
        selected: new Set()
      };
    }

    function assignedPoints() {
      return new Set(builder.classes.flat());
    }

    function renderSecretSetup() {
      const player = state.players[state.setupPlayer];
      const rule = ruleById(state.ruleId);

      document.getElementById("app").innerHTML = `
        <section class="card">
          <h2 class="builder-title">${escapeHtml(player.name)}: create your secret</h2>
          <p class="builder-help">
            Select one or more points, then choose <strong>Add class</strong>.
            Repeat until every point belongs to exactly one class.
            Click an existing class to remove it.
          </p>

          <article class="rule-card">
            <h3>Card ${rule.id}: ${rule.name}</h3>
            <p>${rule.description}</p>
          </article>

          ${builderMarkup()}

          <div class="button-row">
            <button
              class="btn btn-primary"
              id="savePartitionButton"
              onclick="saveSecretPartition()"
            >
              Save secret partition
            </button>

            <button class="btn btn-secondary" onclick="returnToSetup()">
              Cancel game
            </button>
          </div>
        </section>
      `;

      updateBuilderView();
    }

    function builderMarkup() {
      return `
        <div id="dotLine" class="dot-line"></div>

        <div class="button-row">
          <button class="btn btn-primary" onclick="addSelectedClass()">
            Add selected class
          </button>

          <button class="btn btn-secondary" onclick="completeSingletons()">
            Complete with singletons
          </button>

          <button class="btn btn-secondary" onclick="clearBuilder()">
            Clear
          </button>
        </div>

        <div class="partition-preview">
          <div class="label">Current partition</div>
          <div id="classList" class="class-list"></div>
        </div>

        <div id="builderValidation" class="validation"></div>
      `;
    }

    function updateBuilderView() {
      if (!builder) return;

      const assigned = assignedPoints();
      const dotLine = document.getElementById("dotLine");
      const classList = document.getElementById("classList");
      const validation = document.getElementById("builderValidation");

      if (!dotLine || !classList || !validation) return;

      dotLine.innerHTML = Array.from({ length: state.size }, (_, point) => {
        const classIndex = builder.classes.findIndex(group => group.includes(point));
        const isAssigned = assigned.has(point);
        const isSelected = builder.selected.has(point);
        const color =
          classIndex >= 0
            ? CLASS_COLORS[classIndex % CLASS_COLORS.length]
            : "#102a43";

        return `
          <div class="dot-wrap">
            <button
              class="dot ${isSelected ? "selected" : ""} ${
                isAssigned ? "assigned" : ""
              }"
              style="${isAssigned ? `background:${color};box-shadow:0 0 0 2px ${color},0 5px 12px rgba(16,42,67,.2)` : ""}"
              onclick="toggleBuilderPoint(${point})"
              ${isAssigned ? "disabled" : ""}
              aria-label="Point ${point}"
            >
              ${point}
            </button>
            <span class="dot-number">${isAssigned ? `Class ${classIndex + 1}` : "Free"}</span>
          </div>
        `;
      }).join("");

      if (builder.classes.length === 0) {
        classList.innerHTML = `
          <span class="empty-message">No classes have been added yet.</span>
        `;
      } else {
        classList.innerHTML = builder.classes.map((group, index) => `
          <button
            class="class-pill"
            style="background:${CLASS_COLORS[index % CLASS_COLORS.length]}"
            onclick="removeBuilderClass(${index})"
            title="Remove this class"
          >
            {${[...group].sort((a, b) => a - b).join(", ")}}
          </button>
        `).join("");
      }

      const status = validateBuilder();

      validation.className = `validation ${status.valid ? "good" : "bad"}`;
      validation.textContent = status.message;

      const saveButton = document.getElementById("savePartitionButton");
      const declarationButton = document.getElementById("submitDeclarationButton");

      if (saveButton) saveButton.disabled = !status.valid;
      if (declarationButton) declarationButton.disabled = !status.valid;
    }

    function toggleBuilderPoint(point) {
      const assigned = assignedPoints();

      if (assigned.has(point)) return;

      if (builder.selected.has(point)) {
        builder.selected.delete(point);
      } else {
        builder.selected.add(point);
      }

      updateBuilderView();
    }

    function addSelectedClass() {
      if (builder.selected.size === 0) return;

      builder.classes.push(
        [...builder.selected].sort((a, b) => a - b)
      );

      builder.selected.clear();
      updateBuilderView();
    }

    function completeSingletons() {
      const assigned = assignedPoints();

      for (let point = 0; point < state.size; point++) {
        if (!assigned.has(point) && !builder.selected.has(point)) {
          builder.classes.push([point]);
        }
      }

      if (builder.selected.size > 0) {
        builder.classes.push(
          [...builder.selected].sort((a, b) => a - b)
        );
        builder.selected.clear();
      }

      updateBuilderView();
    }

    function removeBuilderClass(index) {
      builder.classes.splice(index, 1);
      updateBuilderView();
    }

    function clearBuilder() {
      builder.classes = [];
      builder.selected.clear();
      updateBuilderView();
    }

    function validateBuilder() {
      const points = builder.classes.flat();
      const unique = new Set(points);

      if (builder.selected.size > 0) {
        return {
          valid: false,
          message: "Add the currently selected points as a class."
        };
      }

      if (points.length !== state.size || unique.size !== state.size) {
        return {
          valid: false,
          message: "Every point must belong to exactly one class."
        };
      }

      if (!matchesRule(builder.classes, state.ruleId, state.size)) {
        return {
          valid: false,
          message: "This partition does not satisfy the selected rule card."
        };
      }

      return {
        valid: true,
        message: "Valid partition. It is ready to save."
      };
    }

    function saveSecretPartition() {
      const status = validateBuilder();
      if (!status.valid) return;

      state.players[state.setupPlayer].secret =
        normalizePartition(builder.classes);

      if (state.mode === "ai") {
        state.players[1].secret = normalizePartition(
          randomChoice(getCandidates(state.size, state.ruleId))
        );

        startGame();
        return;
      }

      if (state.setupPlayer === 0) {
        state.setupPlayer = 1;
        initializeBuilder("setup");

        showPrivacyOverlay(
          "Pass the device",
          "Player 1’s partition has been hidden. Give the device to Player 2.",
          "Player 2 is ready",
          () => render()
        );
      } else {
        startGame();
      }
    }

    function returnToSetup() {
      closeModal();
      state.screen = "setup";
      builder = null;
      render();
    }

    function startGame() {
      const allCandidates = getCandidates(state.size, state.ruleId);

      state.candidates = [
        [...allCandidates],
        [...allCandidates]
      ];

      state.current = 0;
      state.log = [];
      state.questionCounts = [0, 0];
      state.winner = null;
      state.screen = "game";
      builder = null;

      render();

      if (state.mode === "pvp") {
        showTurnPrivacyScreen();
      }
    }

    function playerName(index) {
      return state.players[index].name;
    }

    function renderGame() {
      const actor = state.current;
      const target = 1 - actor;
      const isComputerTurn = state.mode === "ai" && actor === 1;
      const rule = ruleById(state.ruleId);

      document.getElementById("app").innerHTML = `
        <div class="status-bar">
          <div>
            Current turn:
            <strong>${escapeHtml(playerName(actor))}</strong>
          </div>
          <div>
            Card ${rule.id}: <strong>${rule.name}</strong>
          </div>
          <div>
            Board: <strong>0–${state.size - 1}</strong>
          </div>
        </div>

        <section class="game-grid">
          <div class="card">
            <h2>Find ${escapeHtml(playerName(target))}’s partition</h2>

            <div class="action-box">
              <h3>Ask an equivalence question</h3>
              <p class="small-note">
                Choose two different points and ask whether they belong to the same class.
              </p>

              <div class="question-row">
                <select id="questionA" ${isComputerTurn ? "disabled" : ""}>
                  ${pointOptions(0)}
                </select>

                <span class="relation-symbol">∼</span>

                <select id="questionB" ${isComputerTurn ? "disabled" : ""}>
                  ${pointOptions(Math.min(1, state.size - 1))}
                </select>

                <button
                  class="btn btn-primary"
                  onclick="askHumanQuestion()"
                  ${isComputerTurn ? "disabled" : ""}
                >
                  Ask
                </button>
              </div>
            </div>

            <div class="action-box">
              <h3>Declare the complete partition</h3>
              <p class="small-note">
                A correct declaration wins. An incorrect declaration loses immediately.
              </p>

              <button
                class="btn btn-warning"
                onclick="openDeclarationBuilder()"
                ${isComputerTurn ? "disabled" : ""}
              >
                Declare partition
              </button>
            </div>

            <div class="action-box">
              <h3>Your deductions</h3>
              <p>
                Possible enemy partitions:
                <strong>${state.candidates[actor].length.toLocaleString()}</strong>
              </p>

              <div class="legend">
                <span>
                  <i class="legend-mark" style="background:#e8f8f0"></i>
                  Always equivalent
                </span>
                <span>
                  <i class="legend-mark" style="background:#fff0f0"></i>
                  Always separate
                </span>
                <span>
                  <i class="legend-mark" style="background:white;border:1px solid #d7e0e8"></i>
                  Not yet known
                </span>
              </div>

              <div class="knowledge-grid">
                ${knowledgeMarkup(actor)}
              </div>
            </div>
          </div>

          <aside class="card">
            <h2>Game record</h2>

            <div class="score-row">
              <div class="score-box">
                ${escapeHtml(playerName(0))}
                <strong>${state.questionCounts[0]}</strong>
                <span class="small-note">questions</span>
              </div>

              <div class="score-box">
                ${escapeHtml(playerName(1))}
                <strong>${state.questionCounts[1]}</strong>
                <span class="small-note">questions</span>
              </div>
            </div>

            <div class="log" style="margin-top:18px">
              ${
                state.log.length === 0
                  ? `<p class="empty-message">No questions have been asked.</p>`
                  : state.log.map(logEntryMarkup).join("")
              }
            </div>
          </aside>
        </section>
      `;
    }

    function pointOptions(selected) {
      return Array.from({ length: state.size }, (_, point) => `
        <option value="${point}" ${point === selected ? "selected" : ""}>
          Point ${point}
        </option>
      `).join("");
    }

    function knowledgeMarkup(playerIndex) {
      const candidates = state.candidates[playerIndex];

      if (candidates.length === 0) {
        return `<div class="knowledge-cell no">Contradiction</div>`;
      }

      const cells = [];

      for (let a = 0; a < state.size; a++) {
        for (let b = a + 1; b < state.size; b++) {
          let yesCount = 0;

          for (const partition of candidates) {
            if (sameClass(partition, a, b)) {
              yesCount++;
            }
          }

          let status = "unknown";
          let symbol = "?";

          if (yesCount === candidates.length) {
            status = "yes";
            symbol = "✓";
          } else if (yesCount === 0) {
            status = "no";
            symbol = "×";
          }

          cells.push(`
            <div class="knowledge-cell ${status}">
              ${a} ∼ ${b} &nbsp; ${symbol}
            </div>
          `);
        }
      }

      return cells.join("");
    }

    function logEntryMarkup(entry) {
      if (entry.type === "question") {
        return `
          <div class="log-entry">
            <strong>${escapeHtml(entry.actor)}</strong> asked:
            Is ${entry.a} ∼ ${entry.b}?
            <small>
              Answer:
              <strong>${entry.answer ? "Yes" : "No"}</strong>
            </small>
          </div>
        `;
      }

      return `
        <div class="log-entry declare">
          <strong>${escapeHtml(entry.actor)}</strong>
          declared a partition.
          <small>${entry.correct ? "The declaration was correct." : "The declaration was incorrect."}</small>
        </div>
      `;
    }

    function askHumanQuestion() {
      const a = Number(document.getElementById("questionA").value);
      const b = Number(document.getElementById("questionB").value);

      if (a === b) {
        alert("Choose two different points. Every point is automatically equivalent to itself.");
        return;
      }

      resolveQuestion(state.current, a, b);
    }

    function resolveQuestion(actor, a, b) {
      const target = 1 - actor;
      const answer = sameClass(state.players[target].secret, a, b);

      state.questionCounts[actor]++;

      state.candidates[actor] = state.candidates[actor].filter(partition =>
        sameClass(partition, a, b) === answer
      );

      state.log.unshift({
        type: "question",
        actor: playerName(actor),
        a,
        b,
        answer
      });

      state.current = target;
      render();

      if (state.mode === "ai" && state.current === 1) {
        window.setTimeout(computerTurn, 800);
      } else if (state.mode === "pvp") {
        showTurnPrivacyScreen();
      }
    }

    function allInformativePairs(candidates) {
      const pairs = [];

      for (let a = 0; a < state.size; a++) {
        for (let b = a + 1; b < state.size; b++) {
          let yes = 0;

          for (const partition of candidates) {
            if (sameClass(partition, a, b)) {
              yes++;
            }
          }

          const no = candidates.length - yes;

          if (yes > 0 && no > 0) {
            pairs.push({
              a,
              b,
              yes,
              no,
              score: Math.min(yes, no)
            });
          }
        }
      }

      return pairs;
    }

    function chooseComputerQuestion() {
      const candidates = state.candidates[1];
      const pairs = allInformativePairs(candidates);

      if (pairs.length === 0) return null;

      if (state.difficulty === "easy") {
        return randomChoice(pairs);
      }

      pairs.sort((x, y) => y.score - x.score);

      if (state.difficulty === "medium") {
        const topCount = Math.min(6, pairs.length);
        return randomChoice(pairs.slice(0, topCount));
      }

      return pairs[0];
    }

    function computerTurn() {
      if (state.screen !== "game" || state.current !== 1) return;

      const candidates = state.candidates[1];

      if (candidates.length === 1) {
        finishDeclaration(1, candidates[0]);
        return;
      }

      const pair = chooseComputerQuestion();

      if (!pair) {
        finishDeclaration(1, candidates[0]);
        return;
      }

      resolveQuestion(1, pair.a, pair.b);
    }

    function openDeclarationBuilder() {
      initializeBuilder("declaration");

      const modal = document.getElementById("modal");
      modal.classList.remove("hidden");

      modal.innerHTML = `
        <div class="modal-card">
          <h2>Declare the hidden partition</h2>
          <p class="builder-help">
            Build the complete partition you believe your opponent selected.
            Remember: an incorrect declaration loses the game.
          </p>

          ${builderMarkup()}

          <div class="button-row">
            <button
              id="submitDeclarationButton"
              class="btn btn-warning"
              onclick="submitDeclaration()"
            >
              Submit declaration
            </button>

            <button class="btn btn-secondary" onclick="closeModal()">
              Keep investigating
            </button>
          </div>
        </div>
      `;

      updateBuilderView();
    }

    function closeModal() {
      document.getElementById("modal").classList.add("hidden");
      document.getElementById("modal").innerHTML = "";
      builder = null;
    }

    function submitDeclaration() {
      const status = validateBuilder();
      if (!status.valid) return;

      const declared = normalizePartition(builder.classes);
      closeModal();
      finishDeclaration(state.current, declared);
    }

    function finishDeclaration(actor, declaredPartition) {
      const target = 1 - actor;
      const correct =
        partitionKey(declaredPartition) ===
        partitionKey(state.players[target].secret);

      state.log.unshift({
        type: "declaration",
        actor: playerName(actor),
        correct
      });

      state.winner = correct ? actor : target;
      state.screen = "finished";
      render();
    }

    function renderFinished() {
      const winner = state.winner;
      const loser = 1 - winner;
      const lastEntry = state.log[0];
      const declarationCorrect = lastEntry?.correct;

      document.getElementById("app").innerHTML = `
        <section class="card" style="max-width:800px;margin:0 auto;text-align:center">
          <div class="logo" style="margin:0 auto 16px">
            ${declarationCorrect ? "✓" : "!"}
          </div>

          <h2>${escapeHtml(playerName(winner))} wins!</h2>

          <p>
            ${
              declarationCorrect
                ? `${escapeHtml(playerName(winner))} correctly identified the hidden partition.`
                : `${escapeHtml(playerName(loser))} made an incorrect declaration.`
            }
          </p>

          <div class="result-partitions">
            <div class="result-partition">
              <strong>${escapeHtml(playerName(0))}’s partition</strong>
              <div>${formatPartition(state.players[0].secret)}</div>
            </div>

            <div class="result-partition">
              <strong>${escapeHtml(playerName(1))}’s partition</strong>
              <div>${formatPartition(state.players[1].secret)}</div>
            </div>
          </div>

          <div class="score-row">
            <div class="score-box">
              ${escapeHtml(playerName(0))}
              <strong>${state.questionCounts[0]}</strong>
              <span class="small-note">questions asked</span>
            </div>

            <div class="score-box">
              ${escapeHtml(playerName(1))}
              <strong>${state.questionCounts[1]}</strong>
              <span class="small-note">questions asked</span>
            </div>
          </div>

          <div class="button-row" style="justify-content:center">
            <button class="btn btn-primary" onclick="playAgain()">
              Play again
            </button>

            <button class="btn btn-secondary" onclick="returnToSetup()">
              Change settings
            </button>
          </div>
        </section>
      `;
    }

    function playAgain() {
      state.screen = "secret";
      state.players[0].secret = null;
      state.players[1].secret = null;
      state.setupPlayer = 0;
      initializeBuilder("setup");
      render();
    }

    function showPrivacyOverlay(title, message, buttonText, callback) {
      const overlay = document.getElementById("privacyOverlay");
      overlay.classList.remove("hidden");

      overlay.innerHTML = `
        <div class="overlay-card">
          <div class="logo">≈</div>
          <h2>${escapeHtml(title)}</h2>
          <p>${escapeHtml(message)}</p>
          <button id="privacyContinue" class="btn btn-primary">
            ${escapeHtml(buttonText)}
          </button>
        </div>
      `;

      document.getElementById("privacyContinue").onclick = () => {
        overlay.classList.add("hidden");
        overlay.innerHTML = "";
        callback();
      };
    }

    function showTurnPrivacyScreen() {
      const name = playerName(state.current);

      showPrivacyOverlay(
        `${name}’s turn`,
        `Pass the device to ${name}. The other player should look away.`,
        "Begin turn",
        () => render()
      );
    }

    render();
  </script>
</body>
</html>
